<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>职位搜索 - JOB直聘</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="hdr"></div>

<div class="search-band">
  <div class="wrap">
    <div class="expect"><span>推荐</span><span class="sep">|</span>
      <span class="plus">＋</span><span class="add">添加求职期望</span></div>
    <form class="search-form" id="searchForm" onsubmit="return false">
      <span class="ico">⌕</span>
      <input id="q" name="query" placeholder="搜索职位、公司" autocomplete="off">
      <button class="btn-search" id="btnSearch" type="submit">搜索</button>
    </form>
  </div>
</div>

<div class="filter-band">
  <div class="wrap">
    <div class="c-filter-condition" id="filterBar"></div>
    <div class="result-count" id="resultCount"></div>
  </div>
</div>

<div class="wrap main">
  <div class="job-list-wrapper">
    <ul id="jobList"></ul>
    <div class="page" id="pager"></div>
  </div>
  <div class="job-detail-box" id="detailBox"></div>
</div>

<script src="assets/app.js"></script>
<script>
(function () {
  var S = window.Skeleton, DATA = null;
  var state = { query: S.qs('query') || '', city: S.qs('city') || '北京', page: 1, sel: {}, active: null };

  document.getElementById('hdr').innerHTML = S.header('职位');
  document.getElementById('q').value = state.query;

  /* --- 筛选 --- */
  function cityOptions() { return ['不限'].concat(Array.from(new Set(DATA.jobs.map(function (j) { return j.cityName; })))); }
  function areaOptions() {
    var jobs = DATA.jobs.filter(function (j) { return j.cityName === state.city; });
    return ['不限'].concat(Array.from(new Set(jobs.map(function (j) { return j.areaDistrict; }))));
  }

  function renderFilters() {
    var bar = document.getElementById('filterBar');
    var html = '<div class="dd" data-key="cityName"><span class="dd-label"><i>📍</i>' +
      S.esc(state.city) + '<span class="caret"></span></span><ul class="dd-menu">' +
      cityOptions().map(function (o) {
        return '<li class="' + (o === state.city ? 'on' : '') + '" data-v="' + S.esc(o) + '">' + S.esc(o) + '</li>'; }).join('') +
      '</ul></div>';
    S.FILTERS.forEach(function (f) {
      var cur = state.sel[f.key] || '不限';
      var opts = f.dynamic === 'city' ? areaOptions() : f.options;
      html += '<div class="dd' + (cur !== '不限' ? ' sel' : '') + '" data-key="' + f.key + '">' +
        '<span class="dd-label">' + S.esc(cur !== '不限' ? cur : f.label) + '<span class="caret"></span></span>' +
        '<ul class="dd-menu">' + opts.map(function (o) {
          return '<li class="' + (o === cur ? 'on' : '') + '" data-v="' + S.esc(o) + '">' + S.esc(o) + '</li>'; }).join('') +
        '</ul></div>';
    });
    html += '<span class="clear-search-btn" id="btnClear">清空</span>';
    bar.innerHTML = html;

    bar.querySelectorAll('.dd').forEach(function (dd) {
      dd.querySelector('.dd-label').addEventListener('click', function (e) {
        e.stopPropagation();
        var wasOpen = dd.classList.contains('open');
        bar.querySelectorAll('.dd').forEach(function (o) { o.classList.remove('open'); });
        if (!wasOpen) dd.classList.add('open');
      });
      dd.querySelectorAll('.dd-menu li').forEach(function (li) {
        li.addEventListener('click', function (e) {
          e.stopPropagation();
          var key = dd.getAttribute('data-key'), v = li.getAttribute('data-v');
          if (key === 'cityName') { state.city = v === '不限' ? cityOptions()[1] : v; state.sel.areaDistrict = '不限'; }
          else state.sel[key] = v;
          state.page = 1; dd.classList.remove('open'); render();
        });
      });
    });
    document.getElementById('btnClear').addEventListener('click', function () {
      state.sel = {}; state.page = 1; render();
    });
  }
  document.addEventListener('click', function () {
    document.querySelectorAll('.dd.open').forEach(function (d) { d.classList.remove('open'); });
  });

  /* --- 过滤 --- */
  function match(j) {
    if (j.cityName !== state.city) return false;
    var q = state.query.trim();
    if (q && (j.jobName + ' ' + j.brandName + ' ' + (j.skills || []).join(' ')).indexOf(q) < 0) return false;
    for (var k in state.sel) {
      var v = state.sel[k];
      if (!v || v === '不限') continue;
      if (k === 'salaryDesc') {
        var r = S.SALARY_RANGE[v], b = S.salaryBounds(j.salaryDesc);
        if (!b || b[1] < r[0] || b[0] > r[1]) return false;
      } else if (k === 'jobType') {
        if ((j.jobType === 1 ? '兼职' : '全职') !== v) return false;
      } else if (j[k] !== v) return false;
    }
    return true;
  }

  /* --- 详情面板 --- */
  function renderDetail(j) {
    var box = document.getElementById('detailBox');
    if (!j) { box.innerHTML = '<div class="detail-empty">请从左侧选择一个职位</div>'; return; }
    var brand = DATA.brands[j.encryptBrandId];
    box.innerHTML =
      '<div class="job-detail-header"><div class="job-header-info"><div class="job-detail-info">' +
        '<a class="job-name" href="job.html?jobId=' + S.esc(j.encryptJobId) + '">' + S.esc(j.jobName) + '</a>' +
        '<span class="job-salary">' + S.esc(j.salaryDesc) + '</span>' +
        '<ul class="tag-list"><li>' + S.esc(j.cityName) + '</li><li>' + S.esc(j.jobExperience) +
        '</li><li>' + S.esc(j.jobDegree) + '</li></ul></div>' +
        '<div class="job-detail-op">' +
          '<button class="op-btn op-btn-like' + (S.isFav(j.encryptJobId) ? ' on' : '') + '" id="btnLike">☆ ' +
            (S.isFav(j.encryptJobId) ? '已收藏' : '收藏') + '</button>' +
          '<button class="op-btn op-btn-chat">立即沟通</button>' +
        '</div></div></div>' +
      '<div class="job-detail-body">' + S.detailBodyHTML(j, brand) + '</div>';
    document.getElementById('btnLike').addEventListener('click', function () {
      var on = S.toggleFav(j.encryptJobId);
      this.classList.toggle('on', on); this.textContent = on ? '☆ 已收藏' : '☆ 收藏';
    });
  }

  /* --- 渲染 --- */
  function render() {
    renderFilters();
    var hits = DATA.jobs.filter(match);
    var total = hits.length, pages = Math.max(1, Math.ceil(total / S.PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    var slice = hits.slice((state.page - 1) * S.PAGE_SIZE, state.page * S.PAGE_SIZE);

    document.getElementById('resultCount').textContent =
      '为你找到 ' + total + ' 个职位' + (total ? '（第 ' + state.page + '/' + pages + ' 页）' : '');

    var list = document.getElementById('jobList');
    if (!total) {
      list.innerHTML = '<li class="no-result" id="noResult">没有找到匹配的职位，试试放宽筛选条件</li>';
    } else {
      if (slice.indexOf(state.active) < 0) state.active = slice[0];
      list.innerHTML = slice.map(function (j) { return S.cardHTML(j, j === state.active); }).join('');
      list.querySelectorAll('.job-card-box').forEach(function (li) {
        li.addEventListener('click', function () {
          state.active = DATA.jobs.filter(function (j) { return j.encryptJobId === li.getAttribute('data-id'); })[0];
          list.querySelectorAll('.job-card-box').forEach(function (o) { o.classList.remove('active'); });
          li.classList.add('active');
          renderDetail(state.active);
        });
      });
    }
    renderDetail(total ? state.active : null);

    var p = document.getElementById('pager');
    if (pages <= 1) { p.innerHTML = ''; }
    else {
      var h = '<a class="prev' + (state.page === 1 ? ' disabled' : '') + '" data-p="' + (state.page - 1) + '">&lt;</a>';
      for (var i = 1; i <= pages; i++) h += '<a class="' + (i === state.page ? 'cur' : '') + '" data-p="' + i + '">' + i + '</a>';
      h += '<a class="next' + (state.page === pages ? ' disabled' : '') + '" data-p="' + (state.page + 1) + '">&gt;</a>';
      p.innerHTML = h;
      p.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () {
          var n = parseInt(a.getAttribute('data-p'), 10);
          if (a.classList.contains('disabled') || n < 1 || n > pages) return;
          state.page = n; state.active = null; window.scrollTo(0, 0); render();
        });
      });
    }
  }

  document.getElementById('btnSearch').addEventListener('click', function () {
    state.query = document.getElementById('q').value; state.page = 1; state.active = null; render();
  });
  document.getElementById('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btnSearch').click(); }
  });

  S.loadData().then(function (d) {
    DATA = d;
    if (!cityOptions().includes(state.city)) state.city = DATA.jobs[0].cityName;
    render();
  });
})();
</script>
</body>
</html>
